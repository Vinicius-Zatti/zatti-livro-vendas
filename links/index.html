<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinícius Zanetti | Links</title>
<meta name="robots" content="noindex">
<meta name="description" content="Descubra em 5 minutos onde o lucro do seu restaurante vaza.">
<meta name="theme-color" content="#0D1F2D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
:root{--navy:#0D1F2D;--navy-2:#1A3A52;--amber:#C9882A;--amber-dark:#B87A22;--cream:#F5F0E8;--cream-dim:#F5F0E8b3;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;
  background:radial-gradient(120% 60% at 50% 0%,var(--navy-2) 0%,var(--navy) 70%)}
main{width:100%;max-width:440px;padding:56px 20px 40px;display:flex;flex-direction:column;align-items:center;text-align:center}
.foto{width:112px;height:112px;border-radius:50%;object-fit:cover;border:2px solid var(--amber);box-shadow:0 12px 32px -12px #000a}
h1{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.1;margin-top:20px}
.tese{font-size:16px;line-height:1.5;color:var(--cream-dim);margin-top:10px;max-width:30ch}
.linha{width:56px;height:2px;background:var(--amber);margin:28px 0}
.botoes{width:100%;display:flex;flex-direction:column;gap:14px}
.btn{display:block;width:100%;padding:18px 20px;border-radius:14px;text-decoration:none;
  transition:transform .15s ease,background .15s ease;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn strong{display:block;font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.btn span{display:block;font-size:14px;margin-top:4px}
.principal{background:var(--amber);color:var(--navy);box-shadow:0 14px 30px -16px #C9882Acc}
.principal:hover{background:var(--amber-dark)}
.principal span{color:#0D1F2Dcc}
.secundario{border:1.5px solid var(--cream-dim);color:var(--cream)}
.secundario:hover{background:#F5F0E814}
.secundario span{color:var(--cream-dim)}
footer{margin-top:40px;font-size:13px;color:var(--cream-dim)}
footer a{color:var(--cream-dim)}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>
<main>
  <img class="foto" src="/assets/vinicius.jpeg" alt="Vinícius Zanetti" width="112" height="112">
  <h1>Vinícius Zanetti</h1>
  <p class="tese">Transformo restaurantes bagunçados em negócios lucrativos. Sem planilha complicada.</p>
  <div class="linha" aria-hidden="true"></div>
  <div class="botoes">
    <a class="btn principal" href="/diagnostico/?origem=instagram-bio">
      <strong>Quero meu raio-x gratuito</strong>
      <span>Descubra em 5 minutos onde seu lucro vaza</span>
    </a>
    <a class="btn secundario" href="https://wa.me/5511963898411?text=Ol%C3%A1%21%20Vim%20pelo%20Instagram%20e%20quero%20saber%20mais." target="_blank" rel="noopener">
      <strong>Falar comigo no WhatsApp</strong>
      <span>Me conta o que está acontecendo aí</span>
    </a>
  </div>
  <footer>Autor de <a href="/livro/">Restaurante no Controle</a> · <a href="/">Zatti Consultoria</a></footer>
</main>
</body>
</html>
